# Requiere la red compartida: docker network create mcsm
name: mcsm
services:
  panel:
    build: { context: .., dockerfile: deploy/panel.Dockerfile }
    image: mcsm-panel:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      # Vacío: el panel usa la dirección con la que lo abres en el navegador (Host con puerto).
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-}
    volumes:
      - panel-data:/data
  agent:
    build: { context: ../agent }
    image: mcsm-agent:latest
    restart: unless-stopped
    # Al pararlo, el agente espera hasta 25 s a las copias en curso (save-on) antes de salir.
    stop_grace_period: 30s
    depends_on: [panel]
    environment:
      PANEL_URL: http://panel:8080
      ENROLL_TOKEN: ${ENROLL_TOKEN:-}
      NODE_NAME: ${NODE_NAME:-principal}
      DATA_ROOT: ${DATA_ROOT:-/srv/minecraft}
      HOST_PROC: /host/proc
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT:-/srv/minecraft}:${DATA_ROOT:-/srv/minecraft}
      - agent-data:/var/lib/mcsm-agent
      - /proc:/host/proc:ro
    networks: [default, mcsm]
networks:
  mcsm:
    name: mcsm
    external: true
volumes:
  panel-data: {}
  agent-data: {}
