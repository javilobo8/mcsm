# Development: the panel runs on the host (pnpm dev:api), the agent in Docker.
# Requires the shared network: docker network create mcsm
name: mcsm-dev
services:
  agent:
    build: { context: ../agent }
    image: mcsm-agent:dev
    # docker stop kills after 10 s; on stop, the agent waits in parallel, up to 25 s, for its
    # file operations and in-progress backups (save-on) before exiting.
    stop_grace_period: 30s
    environment:
      PANEL_URL: http://host.docker.internal:8080
      ENROLL_TOKEN: ${ENROLL_TOKEN:-}
      NODE_NAME: dev
      DATA_ROOT: ${DATA_ROOT:?Absolute path on the host, e.g. /home/lobo/dev/mc-server-manager/deploy/data}
      # Optional: maximum size of a file upload, in bytes (empty = 4 GiB).
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT}:${DATA_ROOT}
      - agent-dev-data:/var/lib/mcsm-agent
    networks: [mcsm]
networks:
  mcsm:
    name: mcsm
    external: true
volumes:
  agent-dev-data: {}
