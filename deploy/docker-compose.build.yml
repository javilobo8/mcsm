# Build the panel and the agent from source instead of pulling the published images:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml --env-file deploy/.env up -d --build
# With local images, the docker run from “Add node” uses mcsm-agent:latest (build it on each node).
services:
  panel:
    build: { context: .., dockerfile: deploy/panel.Dockerfile }
    image: mcsm-panel:latest
  agent:
    build: { context: ../agent }
    image: mcsm-agent:latest
