# Construir el panel y el agente desde el código en vez de descargar las imágenes publicadas:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml --env-file deploy/.env up -d --build
# Con imágenes locales, el docker run de «Añadir nodo» usa mcsm-agent:latest (constrúyela en cada nodo).
services:
  panel:
    build: { context: .., dockerfile: deploy/panel.Dockerfile }
    image: mcsm-panel:latest
  agent:
    build: { context: ../agent }
    image: mcsm-agent:latest
