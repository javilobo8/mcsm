# Monorepo checks: the “Full verification” from CLAUDE.md except the real-Docker integration tests and the E2E.
# Runs on every push to main and every PR, and release.yml calls it before publishing the images.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  proto:
    name: Protocol (buf)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # buf (and Go) at the versions in mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: buf
      - run: buf lint
      - name: buf breaking against the PR's target branch
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.server_url }}/${{ github.repository }}.git#branch=${{ github.base_ref }}
        run: buf breaking --against "$BASE"
      - name: Generated code is up to date (buf generate)
        run: |
          buf generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated code does not match proto/: run pnpm gen and commit the result."
            exit 1
          fi

  agent:
    name: Agent (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      # Integration tests don't compile under plain go vet: this surfaces their errors without Docker.
      - run: go vet -tags integration ./...
      - run: go test -race ./...

  panel:
    name: Panel (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: the one from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mcsm/web build
