# Comprobaciones del monorepo: la «Verificación completa» de CLAUDE.md salvo la integración con Docker real y la E2E.
# Corre en cada push a main y en cada PR, y release.yml la llama antes de publicar las imágenes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  proto:
    name: Protocolo (buf)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # buf (y Go) en las versiones de mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: buf
      - run: buf lint
      - name: buf breaking contra la rama destino del PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.server_url }}/${{ github.repository }}.git#branch=${{ github.base_ref }}
        run: buf breaking --against "$BASE"
      - name: El código generado está al día (buf generate)
        run: |
          buf generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::El código generado no coincide con proto/: ejecuta pnpm gen y commitea el resultado."
            exit 1
          fi

  agent:
    name: Agente (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      # Los tests de integración no compilan con go vet normal: así salen sus errores sin Docker.
      - run: go vet -tags integration ./...
      - run: go test -race ./...

  panel:
    name: Panel (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sin versión: la de packageManager en package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mcsm/web build
