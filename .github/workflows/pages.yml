# Project website (website/) on GitHub Pages: https://javilobo8.github.io/mcsm/
# Builds on every PR that touches it and deploys from main. It also redeploys after a successful Release so the
# version badge (read from agent/VERSION at build time) follows the published images. A `release` trigger would run
# on the tag, which the github-pages environment rejects; workflow_run runs on the default branch.
# Requires Settings → Pages → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - deploy/docker-compose.yml
      - deploy/docker-compose.node.yml
      - deploy/.env.example
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - website/**
      - deploy/docker-compose.yml
      - deploy/docker-compose.node.yml
      - deploy/.env.example
      - .github/workflows/pages.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Deployments queue without cancelling each other; a newer push to a PR cancels its older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # website/ is its own pnpm project (own lockfile), outside the panel workspace.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
          cache: true
          cache_dependency_path: website/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
