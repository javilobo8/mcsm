syntax = "proto3";

package mcsm.v1;

// Envelope es el único tipo que viaja por el WebSocket. `id` identifica una
// petición y su respuesta; `stream_id` agrupa los frames de un stream.
message Envelope {
  uint64 id = 1;
  uint64 stream_id = 2;
  oneof body {
    Hello hello = 10;
    HelloAck hello_ack = 11;
    SyncSpecs sync_specs = 12;
    ApplySpec apply_spec = 13;
    RemoveServer remove_server = 14;
    PowerAction power_action = 15;
    SendCommand send_command = 16;
    CommandResult command_result = 17;
    SubscribeLogs subscribe_logs = 18;
    LogLine log_line = 19;
    StreamClose stream_close = 20;
    ServerObserved server_observed = 21;
    Ack ack = 22;
    Error error = 23;
    // ── plan-2 ──
    // ── plan-3 ──
    // ── plan-4 ──
    BackupNow backup_now = 50;
    BackupRestore backup_restore = 51;
    BackupDelete backup_delete = 52;
    BackupList backup_list = 53;
    BackupInventory backup_inventory = 54;
    BackupCreated backup_created = 55;
    BackupDeleted backup_deleted = 56;
    JobProgress job_progress = 57;
    // ── plan-5 ──
    // ── plan-6 ──
    // ── plan-7 ──
    // ── plan-8 ──
    // ── plan-9 ──
  }
}

message HostInfo {
  string hostname = 1;
  uint32 cpus = 2;
  uint64 mem_total_bytes = 3;
  string os = 4;
  string arch = 5;
}

message Hello {
  string agent_version = 1;
  string docker_version = 2;
  HostInfo host = 3;
  map<string, uint64> spec_versions = 4;
  // Estado deseado que el agente tiene guardado por servidor. El panel reenvía en
  // SyncSpecs las specs cuya versión o estado deseado difieren de los suyos.
  map<string, DesiredState> desired_states = 5;
}

message HelloAck {
  string node_id = 1;
}

enum DesiredState {
  DESIRED_STATE_UNSPECIFIED = 0;
  DESIRED_STATE_RUNNING = 1;
  DESIRED_STATE_STOPPED = 2;
}

message ServerSpec {
  string server_id = 1;
  string slug = 2;
  uint64 version = 3;
  DesiredState desired_state = 4;
  bytes spec_json = 5;
}

message SyncSpecs {
  repeated ServerSpec servers = 1;
  repeated string removed_ids = 2;
}

message ApplySpec {
  ServerSpec server = 1;
}

message RemoveServer {
  string server_id = 1;
  bool delete_data = 2;
}

enum PowerActionType {
  POWER_ACTION_TYPE_UNSPECIFIED = 0;
  POWER_ACTION_TYPE_START = 1;
  POWER_ACTION_TYPE_STOP = 2;
  POWER_ACTION_TYPE_RESTART = 3;
  POWER_ACTION_TYPE_KILL = 4;
}

message PowerAction {
  string server_id = 1;
  PowerActionType action = 2;
}

message SendCommand {
  string server_id = 1;
  string command = 2;
}

message CommandResult {
  string output = 1;
}

// Respuesta: Ack con envelope.stream_id = envelope.id de la petición.
message SubscribeLogs {
  string server_id = 1;
  uint32 tail = 2;
}

message LogLine {
  string server_id = 1;
  int64 ts_unix_ms = 2;
  string line = 3;
}

message StreamClose {
  string reason = 1;
}

message McStatus {
  bool online = 1;
  uint32 players_online = 2;
  uint32 players_max = 3;
  string version = 4;
  uint32 latency_ms = 5;
}

message Observed {
  string container_id = 1;
  string state = 2; // missing|created|running|restarting|exited|dead|paused
  string health = 3; // ""|starting|healthy|unhealthy
  int64 started_at_unix = 4;
  int32 exit_code = 5;
  uint64 applied_version = 6;
  string error = 7;
  McStatus mc = 8;
}

message ServerObserved {
  string server_id = 1;
  Observed observed = 2;
  int64 ts_unix_ms = 3;
}

message Ack {}

// Respuesta de error a una petición (mismo id). Catálogo de `code`, con su traducción a
// HTTP en el panel (agentErrorToHttp en panel/apps/api/src/lib/http.ts). Constantes:
// agent/internal/errcode (Go) y panel/apps/api/src/agents/error-codes.ts (TS); un código
// nuevo se añade en los tres sitios. Un código desconocido para el panel es 502.
//   invalid_spec     spec inválida (server_id o slug)                  400
//   invalid_request  petición mal formada                              400
//   unknown_server   el nodo no conoce ese servidor                    404
//   not_found        recurso inexistente (fichero, copia…)            404
//   busy             el servidor está ocupado con otra operación       409
//   exists           ya existe                                         409
//   unsupported      el agente no entiende el cuerpo: desactualizado   409
//   too_large        demasiado grande                                  413
//   apply_failed, remove_failed, power_failed, bad_spec, rcon_failed   502 con el texto
//                    del agente o de Docker (spec §10)
// Solo en el panel (AgentError local, nunca viajan): disconnected y syncing (409),
// timeout (504), protocol (502).
// El agente nunca responde a un Ack o un Error recibidos.
message Error {
  string code = 1;
  string message = 2;
}

// ── plan-2 ──
// ── plan-3 ──
// ── plan-4 ──

// Copias de seguridad (spec §6.5) y jobs largos del agente (spec §5.3–5.4).

enum BackupTrigger {
  BACKUP_TRIGGER_UNSPECIFIED = 0;
  BACKUP_TRIGGER_MANUAL = 1;
  BACKUP_TRIGGER_SCHEDULED = 2;
  BACKUP_TRIGGER_PRE_MIGRATION = 3;
  BACKUP_TRIGGER_PRE_RESTORE = 4;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_RUNNING = 1;
  JOB_STATUS_OK = 2;
  JOB_STATUS_FAILED = 3;
}

// BackupInfo describe una copia en el disco del nodo. `filename` es el .tar.zst de
// <DATA_ROOT>/<slug>/backups/ o, con trigger PRE_RESTORE, el directorio
// data.pre-restore-<ts> que se conserva junto a data/.
message BackupInfo {
  string server_id = 1;
  string filename = 2;
  uint64 size_bytes = 3;
  string sha256 = 4; // vacío en los directorios pre-restore
  uint64 spec_version = 5;
  BackupTrigger trigger = 6;
  int64 started_unix_ms = 7;
  int64 finished_unix_ms = 8;
}

// Panel → agente. Respuesta: Ack (aceptado; el avance llega por JobProgress) o Error
// (code busy | unknown_server | invalid_request | backup_failed). Un job_id repetido
// no se ejecuta dos veces: el agente reenvía su estado guardado.
message BackupNow {
  string server_id = 1;
  string job_id = 2;
  BackupTrigger trigger = 3; // MANUAL si no se indica; PRE_MIGRATION lo usará el Plan 7
}

// Panel → agente. Restaura una copia .tar.zst por nombre (el agente no conoce los ids
// del panel). Respuesta: Ack o Error, como BackupNow.
message BackupRestore {
  string server_id = 1;
  string filename = 2;
  string job_id = 3;
}

// Panel → agente. Borra una copia o un directorio pre-restore. Respuesta: Ack o Error.
message BackupDelete {
  string server_id = 1;
  string filename = 2;
}

// Panel → agente. Respuesta: Ack y después un BackupInventory no solicitado (id 0).
// server_id vacío = todos los servidores del nodo.
message BackupList {
  string server_id = 1;
}

// Agente → panel (id 0). `server_ids` son los servidores cuyo listado está completo: el
// panel marca como borradas las copias de esos servidores que no aparezcan en `backups`.
message BackupInventory {
  repeated string server_ids = 1;
  repeated BackupInfo backups = 2;
  repeated JobRecord jobs = 3;
}

// Agente → panel (id 0): copia nueva (manual, programada o datos pre-restore).
message BackupCreated {
  BackupInfo backup = 1;
  string job_id = 2; // vacío en las pre-restore
}

// Agente → panel (id 0): copia borrada por el propio agente (poda).
message BackupDeleted {
  string server_id = 1;
  string filename = 2;
  string reason = 3;
}

// Agente → panel (id 0): avance de un job. log_chunk trae solo las líneas nuevas.
message JobProgress {
  string job_id = 1;
  string server_id = 2;
  string type = 3; // backup | restore
  JobStatus status = 4;
  uint32 progress = 5; // 0-100
  string message = 6;
  string log_chunk = 7;
  int64 ts_unix_ms = 8;
}

// Estado completo de un job guardado en el agente (inventario tras reconectar).
message JobRecord {
  string job_id = 1;
  string server_id = 2;
  string type = 3;
  JobStatus status = 4;
  uint32 progress = 5;
  string message = 6;
  string log = 7;
  int64 started_unix_ms = 8;
  int64 finished_unix_ms = 9;
}
