syntax = "proto3";

package mcsm.v1;

// Envelope es el único tipo que viaja por el WebSocket. `id` identifica una
// petición y su respuesta; `stream_id` agrupa los frames de un stream.
message Envelope {
  uint64 id = 1;
  uint64 stream_id = 2;
  oneof body {
    Hello hello = 10;
    HelloAck hello_ack = 11;
    SyncSpecs sync_specs = 12;
    ApplySpec apply_spec = 13;
    RemoveServer remove_server = 14;
    PowerAction power_action = 15;
    SendCommand send_command = 16;
    CommandResult command_result = 17;
    SubscribeLogs subscribe_logs = 18;
    LogLine log_line = 19;
    StreamClose stream_close = 20;
    ServerObserved server_observed = 21;
    Ack ack = 22;
    Error error = 23;
    // ── plan-2 ──
    MetricBatch metric_batch = 30;
    // ── plan-3 ──
    // ── plan-4 ──
    BackupNow backup_now = 50;
    BackupRestore backup_restore = 51;
    BackupDelete backup_delete = 52;
    BackupList backup_list = 53;
    BackupInventory backup_inventory = 54;
    BackupCreated backup_created = 55;
    BackupDeleted backup_deleted = 56;
    JobProgress job_progress = 57;
    // ── plan-5 ──
    FilesList files_list = 70;
    FilesListResult files_list_result = 71;
    FilesStat files_stat = 72;
    FilesStatResult files_stat_result = 73;
    FilesRead files_read = 74;
    FilesReadResult files_read_result = 75;
    FilesWrite files_write = 76;
    FilesMkdir files_mkdir = 77;
    FilesRename files_rename = 78;
    FilesDelete files_delete = 79;
    FilesDownload files_download = 80;
    FilesUpload files_upload = 81;
    // ── plan-6 ──
    ImportScan import_scan = 90;
    ImportScanResult import_scan_result = 91;
    ImportAdopt import_adopt = 92;
    // ── plan-7 ──
    BackupPush backup_push = 100;
    BackupPushResult backup_push_result = 101;
    MigrateReceive migrate_receive = 102;
    MigrateAbort migrate_abort = 103;
    MigrateRetire migrate_retire = 104;
    MigrateConfirm migrate_confirm = 105;
    // ── plan-8 ──
    RouterApply router_apply = 110;
    RouterRemove router_remove = 111;
    RouterObserved router_observed = 112;
    // ── plan-9 ──
  }
}

message HostInfo {
  string hostname = 1;
  uint32 cpus = 2;
  uint64 mem_total_bytes = 3;
  string os = 4;
  string arch = 5;
}

message Hello {
  string agent_version = 1;
  string docker_version = 2;
  HostInfo host = 3;
  map<string, uint64> spec_versions = 4;
  // Estado deseado que el agente tiene guardado por servidor. El panel reenvía en
  // SyncSpecs las specs cuya versión o estado deseado difieren de los suyos.
  map<string, DesiredState> desired_states = 5;
}

message HelloAck {
  string node_id = 1;
}

enum DesiredState {
  DESIRED_STATE_UNSPECIFIED = 0;
  DESIRED_STATE_RUNNING = 1;
  DESIRED_STATE_STOPPED = 2;
}

message ServerSpec {
  string server_id = 1;
  string slug = 2;
  uint64 version = 3;
  DesiredState desired_state = 4;
  bytes spec_json = 5;
}

message SyncSpecs {
  repeated ServerSpec servers = 1;
  repeated string removed_ids = 2;
}

message ApplySpec {
  ServerSpec server = 1;
}

message RemoveServer {
  string server_id = 1;
  bool delete_data = 2;
}

enum PowerActionType {
  POWER_ACTION_TYPE_UNSPECIFIED = 0;
  POWER_ACTION_TYPE_START = 1;
  POWER_ACTION_TYPE_STOP = 2;
  POWER_ACTION_TYPE_RESTART = 3;
  POWER_ACTION_TYPE_KILL = 4;
}

message PowerAction {
  string server_id = 1;
  PowerActionType action = 2;
}

message SendCommand {
  string server_id = 1;
  string command = 2;
}

message CommandResult {
  string output = 1;
}

// Respuesta: Ack con envelope.stream_id = envelope.id de la petición.
message SubscribeLogs {
  string server_id = 1;
  uint32 tail = 2;
}

message LogLine {
  string server_id = 1;
  int64 ts_unix_ms = 2;
  string line = 3;
}

message StreamClose {
  string reason = 1;
}

message McStatus {
  bool online = 1;
  uint32 players_online = 2;
  uint32 players_max = 3;
  string version = 4;
  uint32 latency_ms = 5;
}

message Observed {
  string container_id = 1;
  string state = 2; // missing|created|running|restarting|exited|dead|paused
  string health = 3; // ""|starting|healthy|unhealthy
  int64 started_at_unix = 4;
  int32 exit_code = 5;
  uint64 applied_version = 6;
  string error = 7;
  McStatus mc = 8;
}

message ServerObserved {
  string server_id = 1;
  Observed observed = 2;
  int64 ts_unix_ms = 3;
}

message Ack {}

// Respuesta de error a una petición (mismo id). Catálogo de `code`, con su traducción a
// HTTP en el panel (agentErrorToHttp en panel/apps/api/src/lib/http.ts). Constantes:
// agent/internal/errcode (Go) y panel/apps/api/src/agents/error-codes.ts (TS); un código
// nuevo se añade en los tres sitios. Un código desconocido para el panel es 502.
//   invalid_spec     spec inválida (server_id o slug)                  400
//   invalid_request  petición mal formada                              400
//   unknown_server   el nodo no conoce ese servidor                    404
//   not_found        recurso inexistente (fichero, copia…)            404
//   busy             servidor ocupado o reservado (el mensaje da el motivo)  409
//   exists           ya existe                                         409
//   unsupported      el agente no entiende el cuerpo: desactualizado   409
//   too_large        demasiado grande                                  413
//   invalid_path     ruta con «..», caracteres de control o fichero no regular   400
//   path_outside     la ruta resuelta sale de /data del servidor        400
//   root             operación no permitida sobre la raíz               400
//   is_dir           era un fichero y es una carpeta                    400
//   not_dir          era una carpeta y es un fichero                    400
//   transfer_failed  subida/descarga fallida                            502
//   io_error         error de E/S del host                              502
//   external_data    los datos del servidor están fuera de DATA_ROOT (dataPath):  409
//                    sin copias de seguridad ni archivos (Plan 6)
//   apply_failed, remove_failed, power_failed, bad_spec, rcon_failed   502 con el texto
//                    del agente o de Docker (spec §10)
//   backup_failed    fallo de una copia, restauración o borrado de copias  502
// Solo en el panel (AgentError local, nunca viajan): disconnected y syncing (409),
// timeout (504), protocol (502).
// El agente nunca responde a un Ack o un Error recibidos.
message Error {
  string code = 1;
  string message = 2;
}

// ── plan-2 ──

// MetricBatch agrupa las métricas de un ciclo de muestreo (cada 10 s, spec §6.4).
// Agente → panel, no solicitado (Envelope.id = 0). Solo lleva servidores cuyo
// contenedor está en marcha.
message MetricBatch {
  // Epoch en segundos, redondeado hacia abajo a múltiplo de 10.
  int64 ts_unix = 1;
  // Ausente mientras no haya dos lecturas de CPU del host.
  HostMetricSample host = 2;
  repeated ServerMetricSample servers = 3;
}

message HostMetricSample {
  // 0–100 sobre todas las CPU del host.
  double cpu_pct = 1;
  // Total menos disponible.
  uint64 mem_used_bytes = 2;
  uint64 mem_total_bytes = 3;
  // Sistema de ficheros que contiene DATA_ROOT.
  uint64 disk_used_bytes = 4;
  uint64 disk_total_bytes = 5;
}

message ServerMetricSample {
  string server_id = 1;
  // 100 = un núcleo completo (mismo criterio que `docker stats`).
  double cpu_pct = 2;
  // Uso sin la caché de páginas inactiva.
  uint64 mem_bytes = 3;
  uint64 mem_limit_bytes = 4;
  // Acumulados desde que arrancó el contenedor (todas las interfaces).
  uint64 net_rx_bytes = 5;
  uint64 net_tx_bytes = 6;
  // El Server List Ping respondió; si es false, players_* y ping_ms no significan nada.
  bool mc_online = 7;
  uint32 players_online = 8;
  uint32 players_max = 9;
  uint32 ping_ms = 10;
  // Solo PAPER/PURPUR: TPS del último minuto, medido en los últimos 45 s.
  optional double tps = 11;
}
// ── plan-3 ──
// ── plan-4 ──

// Copias de seguridad (spec §6.5) y jobs largos del agente (spec §5.3–5.4).

enum BackupTrigger {
  BACKUP_TRIGGER_UNSPECIFIED = 0;
  BACKUP_TRIGGER_MANUAL = 1;
  BACKUP_TRIGGER_SCHEDULED = 2;
  BACKUP_TRIGGER_PRE_MIGRATION = 3;
  BACKUP_TRIGGER_PRE_RESTORE = 4;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_RUNNING = 1;
  JOB_STATUS_OK = 2;
  JOB_STATUS_FAILED = 3;
}

// BackupInfo describe una copia en el disco del nodo. `filename` es el .tar.zst de
// <DATA_ROOT>/<slug>/backups/ o, con trigger PRE_RESTORE, el directorio
// data.pre-restore-<ts> que se conserva junto a data/.
message BackupInfo {
  string server_id = 1;
  string filename = 2;
  uint64 size_bytes = 3;
  string sha256 = 4; // vacío en los directorios pre-restore
  uint64 spec_version = 5;
  BackupTrigger trigger = 6;
  int64 started_unix_ms = 7;
  int64 finished_unix_ms = 8;
}

// Panel → agente. Respuesta: Ack (aceptado; el avance llega por JobProgress) o Error
// (code busy | unknown_server | invalid_request | backup_failed). Un job_id repetido
// no se ejecuta dos veces: el agente reenvía su estado guardado.
message BackupNow {
  string server_id = 1;
  string job_id = 2;
  BackupTrigger trigger = 3; // MANUAL si no se indica; PRE_MIGRATION lo usará el Plan 7
}

// Panel → agente. Restaura una copia .tar.zst por nombre (el agente no conoce los ids
// del panel). Respuesta: Ack o Error, como BackupNow.
message BackupRestore {
  string server_id = 1;
  string filename = 2;
  string job_id = 3;
}

// Panel → agente. Borra una copia o un directorio pre-restore. Respuesta: Ack o Error.
message BackupDelete {
  string server_id = 1;
  string filename = 2;
}

// Panel → agente. Respuesta: Ack y un BackupInventory no solicitado (id 0), que puede llegar
// antes o después del Ack. server_id vacío = todos los servidores del nodo.
message BackupList {
  string server_id = 1;
}

// Agente → panel (id 0), tras cada BackupList y, sin que se lo pidan, cada 10 min. `server_ids`
// son los servidores cuyo listado está completo. El agente lo envía en orden con BackupCreated
// y BackupDeleted (un cambio que el listado no vio llega después), por una cola que no está
// ligada a la sesión: puede llegar en la sesión siguiente, tras su Hello.
//
// `request_id` es el id del BackupList al que contesta, o 0 si es el periódico. Solo un
// inventario que contesta al último BackupList de la sesión vigente permite al panel la vía
// negativa: marcar como borradas las copias de `server_ids` que no aparezcan en `backups` y
// dar por perdidos los jobs abiertos que no aparezcan en `jobs` (en ambos casos, solo lo que
// ya conocía antes de pedirlo). Cualquier otro (periódico o de una petición anterior) solo
// aplica lo positivo: altas de copias y estados de jobs.
message BackupInventory {
  repeated string server_ids = 1;
  repeated BackupInfo backups = 2;
  repeated JobRecord jobs = 3;
  uint64 request_id = 4;
}

// Agente → panel (id 0): copia nueva (manual, programada o datos pre-restore).
message BackupCreated {
  BackupInfo backup = 1;
  string job_id = 2; // vacío en las pre-restore
}

// Agente → panel (id 0): copia borrada en el nodo, por la poda (reason "poda") o porque la
// pidió el panel con BackupDelete (reason "borrada").
message BackupDeleted {
  string server_id = 1;
  string filename = 2;
  string reason = 3;
}

// Agente → panel (id 0): avance de un job. log_chunk trae solo las líneas nuevas.
message JobProgress {
  string job_id = 1;
  string server_id = 2;
  string type = 3; // backup | restore
  JobStatus status = 4;
  uint32 progress = 5; // 0-100
  string message = 6;
  string log_chunk = 7;
  int64 ts_unix_ms = 8;
}

// Estado completo de un job guardado en el agente (inventario tras reconectar).
message JobRecord {
  string job_id = 1;
  string server_id = 2;
  string type = 3;
  JobStatus status = 4;
  uint32 progress = 5;
  string message = 6;
  string log = 7;
  int64 started_unix_ms = 8;
  int64 finished_unix_ms = 9;
}
// ── plan-5 ──
// Archivos de un servidor (spec §5.3, §6.6). Las rutas son relativas a /data del
// servidor, con "/" como separador ("/" es la raíz); el agente rechaza ".." y
// caracteres de control. Respuestas: los *Result, Ack o Error{code, message} con
// code ∈ invalid_path|path_outside|unknown_server|not_found|exists|is_dir|not_dir|
// too_large|root|transfer_failed|io_error|busy|unsupported. busy: el nodo ya tiene 4
// transferencias en curso o se está cerrando o, solo en las que escriben (Write, Mkdir,
// Rename, Delete, Upload), el servidor está reservado (copia, restauración o bloqueado sin
// data); el mensaje dice el motivo. unsupported: Files* que este agente no conoce.

message FileEntry {
  string name = 1;
  bool dir = 2;
  bool symlink = 3;
  uint64 size = 4;
  int64 mod_time_unix_ms = 5;
  uint32 mode = 6; // bits de permisos (0o755…)
}

message FilesList {
  string server_id = 1;
  string path = 2;
}

message FilesListResult {
  repeated FileEntry entries = 1; // carpetas primero, luego por nombre
  bool truncated = 2; // la carpeta tiene más entradas de las devueltas
}

message FilesStat {
  string server_id = 1;
  string path = 2;
}

message FilesStatResult {
  FileEntry entry = 1;
}

// Lectura inline: como máximo 2 MiB (o max_bytes si es menor); si no, too_large.
message FilesRead {
  string server_id = 1;
  string path = 2;
  uint32 max_bytes = 3;
}

message FilesReadResult {
  bytes content = 1;
  uint64 size = 2;
}

// Escritura inline atómica (temporal + rename), como máximo 2 MiB. Respuesta: Ack.
message FilesWrite {
  string server_id = 1;
  string path = 2;
  bytes content = 3;
}

message FilesMkdir {
  string server_id = 1;
  string path = 2;
}

// No sobrescribe: si `to` existe responde exists.
message FilesRename {
  string server_id = 1;
  string from = 2;
  string to = 3;
}

// Una carpeta se borra con todo su contenido; un enlace se borra a sí mismo.
message FilesDelete {
  string server_id = 1;
  string path = 2;
}

// El agente sube el fichero con PUT /agent/transfer/{transfer_id} y responde Ack
// cuando el panel lo ha recibido entero.
message FilesDownload {
  string server_id = 1;
  string path = 2;
  string transfer_id = 3;
}

// El agente descarga el contenido con GET /agent/transfer/{transfer_id}, lo escribe
// de forma atómica y responde Ack. size = -1 si el panel no conoce el tamaño.
message FilesUpload {
  string server_id = 1;
  string path = 2;
  string transfer_id = 3;
  int64 size = 4;
}
// ── plan-6 ──
// Importación de contenedores existentes (spec §6.7).

// Panel → agente. Lista los contenedores cuya imagen es itzg/minecraft-server, sin la etiqueta
// mcsm.managed y que este agente no haya adoptado ya. Respuesta: ImportScanResult, o Error.
message ImportScan {}

message ImportScanResult {
  repeated ImportCandidate candidates = 1;
  // DATA_ROOT del agente: el panel decide con él si los datos de un candidato están en
  // <DATA_ROOT>/<slug>/data o necesitan dataPath.
  string data_root = 2;
}

// Inspect reducido de un contenedor importable. `env` lleva solo lo que fijó el usuario (sin las
// variables idénticas al ENV de la imagen) e INCLUYE secretos (RCON_PASSWORD, CF_API_KEY): el
// panel no los reenvía al navegador ni los registra.
message ImportCandidate {
  string container_id = 1; // id completo
  string name = 2; // sin "/" inicial
  string image = 3; // Config.Image tal cual (itzg/minecraft-server:java21)
  string state = 4; // created|running|restarting|exited|paused|dead
  map<string, string> env = 5;
  repeated ImportPort ports = 6; // publicaciones configuradas (HostConfig.PortBindings)
  repeated ImportMount mounts = 7;
  string restart_policy = 8; // no|always|unless-stopped|on-failure ("" = no)
  int64 memory_limit_bytes = 9; // 0 = sin límite
  int64 nano_cpus = 10; // 0 = sin límite
  string network_mode = 11; // bridge|host|none|container:<id>|<red de usuario>
  repeated string networks = 12;
  map<string, string> labels = 13; // solo com.docker.compose.project y com.docker.compose.service
  string user = 14; // Config.User (--user): "" = el de la imagen; "uid[:gid]" o un nombre
}

message ImportPort {
  uint32 container_port = 1;
  string proto = 2; // tcp|udp
  string host_ip = 3; // "" = todas las interfaces
  uint32 host_port = 4; // 0 = efímero
}

message ImportMount {
  string type = 1; // bind|volume|tmpfs…
  string source = 2; // ruta del host (bind) o del volumen
  string destination = 3;
  bool read_write = 4;
  string name = 5; // nombre del volumen
}

// Panel → agente. Adopta un contenedor sin recrearlo. server.spec_json lleva "adopt":
// {"containerId", "version"} (lo añade el panel). El agente comprueba que el contenedor existe,
// no es de MC Server Manager, usa la imagen itzg y monta en /data la carpeta de la spec; lo
// conecta a su red con el alias mcsm-<slug> y guarda spec y adopción. Respuesta: Ack, o Error con
// not_found (no existe), exists (gestionado o adoptado por otro servidor), invalid_request (no es
// itzg, red host/none/container o /data distinto), invalid_spec o apply_failed (Docker).
message ImportAdopt {
  ServerSpec server = 1;
}
// ── plan-7 ──
// Migración entre nodos (spec §7 MigrationService). La orquesta el panel; el agente ejecuta
// pasos idempotentes sobre su disco y su Docker. Origen: BackupPush y MigrateRetire. Destino:
// MigrateReceive y MigrateAbort.

// Panel → agente (origen). Sube una copia .tar.zst de <slug>/backups/ al panel con
// PUT /agent/transfer/{transfer_id}. Respuesta: BackupPushResult cuando el panel la ha recibido
// entera, o Error (unknown_server | invalid_request | busy | transfer_failed | backup_failed: la
// copia no existe o no tiene sha256 en su .json, que se lee primero | not_found: el .json existe
// pero el .tar.zst no).
message BackupPush {
  string server_id = 1;
  string filename = 2;
  string transfer_id = 3;
}

// Metadatos de la copia enviada, de su .json: el panel compara tamaño y sha256 con lo que ha
// recibido y con el BackupCreated del job.
message BackupPushResult {
  uint64 size_bytes = 1;
  string sha256 = 2;
  uint64 data_bytes = 3; // contenido sin comprimir; 0 si la copia no lo anotó
}

// Panel → agente (destino). Job (type "migrate_in"): descarga la copia con
// GET /agent/transfer/{transfer_id} a <DATA_ROOT>/<slug>/backups/<filename>, comprueba que
// llegan size_bytes bytes con ese sha256 y la restaura como <DATA_ROOT>/<slug>/data.
// <DATA_ROOT>/<slug> no puede existir: lo crea con el marcador .mcsm-migration (contiene
// migration_id) y, si algo falla, lo borra entero. El servidor no puede estar en este nodo.
// Respuesta: Ack (aceptado; el avance llega por JobProgress) o Error (invalid_request | exists |
// busy | too_large: no cabe con el margen). Un job_id repetido reenvía su estado.
message MigrateReceive {
  string server_id = 1;
  string slug = 2; // slug en el destino
  string job_id = 3;
  string migration_id = 4;
  string transfer_id = 5;
  string filename = 6; // <slug>-<ts>-<versión>.tar.zst, con el slug del destino
  uint64 size_bytes = 7;
  string sha256 = 8;
  uint64 data_bytes = 9; // 0 = desconocido (se reserva el tamaño comprimido)
}

// Panel → agente (destino). Deshace lo que dejó en este nodo una migración no confirmada:
// olvida la spec del servidor (si la tiene) y borra su contenedor y, ya sin él, borra
// <DATA_ROOT>/<slug> solo si lleva el marcador de migration_id sin confirmar y ningún otro
// servidor del nodo usa ese slug. El marcador se lee ANTES de tocar la spec: si el servidor está
// en este nodo y <slug> no lleva el marcador sin confirmar de esta migración (p. ej. ya llegó
// MigrateConfirm), no toca nada. Idempotente. Respuesta: Ack o Error (busy: hay una recepción en
// curso o el contenedor aún no se pudo borrar; el panel reintenta. invalid_request: otro slug,
// otro servidor lo usa, o el servidor de este nodo no es una copia sin confirmar de esta migración).
message MigrateAbort {
  string server_id = 1;
  string slug = 2;
  string migration_id = 3;
}

// Panel → agente (origen), tras confirmar la migración. Comprueba que la spec guardada es la
// versión source_version (la que se migró: un servidor que volvió después a este nodo trae otra),
// marca <slug> con .mcsm-retiring (migration_id), para el contenedor si sigue en marcha, olvida la
// spec y borra el contenedor y, solo entonces, aparta <DATA_ROOT>/<slug> (datos y copias) a
// <DATA_ROOT>/<slug>.migrated-<ts> o, con delete_data, lo borra. Un reintento sin spec solo toca un
// <slug> con el .mcsm-retiring de esta migración. Idempotente. Respuesta: Ack o Error
// (invalid_request: otro slug, otra versión, otro servidor del nodo usa ese slug o <slug> no es el
// de esta retirada (p. ej. una recepción en curso: marcador de migración sin confirmar); busy:
// reintentar, p. ej. el contenedor aún no se pudo borrar).
message MigrateRetire {
  string server_id = 1;
  string slug = 2;
  string migration_id = 3;
  bool delete_data = 4;
  uint64 source_version = 5; // versión de la spec en el origen al empezar la migración
}

// Panel → agente (destino), tras confirmar la migración (y reintentado hasta el Ack). Reescribe
// el marcador <DATA_ROOT>/<slug>/.mcsm-migration de migration_id como «committed <migration_id>»:
// desde entonces ningún MigrateAbort (p. ej. de un panel restaurado desde una foto anterior al
// commit) borra el servidor. Idempotente. Respuesta: Ack (también si ya estaba confirmado o no
// hay marcador) o Error (invalid_request: otro slug, o el marcador es de otra migración; busy).
message MigrateConfirm {
  string server_id = 1;
  string slug = 2;
  string migration_id = 3;
}
// ── plan-8 ──
// mc-router por nodo (spec §4 router_deployments, §5.3 RouterApply/RouterRemove). El agente mantiene
// un contenedor `mcsm-router` (itzg/mc-router con -in-docker) en la red de los servidores, que enruta
// por el hostname del handshake a los contenedores con la etiqueta mc-router.host. El panel es la
// verdad: tras cada SyncSpecs le reenvía RouterApply o RouterRemove si tiene configuración del nodo.

// Configuración del router de un nodo.
message RouterSpec {
  uint32 host_port = 1; // puerto TCP del host (1-65535); dentro del contenedor siempre es 25565
  bool autoscale = 2; // mc-router arranca al entrar un jugador y para tras autoscale_down_after_minutes sin jugadores
  uint32 autoscale_down_after_minutes = 3; // 1-1440; 0 = 10
  // Con autoscale, solo estos jugadores (nombre de perfil o UUID) despiertan un servidor dormido o
  // cancelan su parada (-auto-scale-allow-deny de mc-router). Vacío = cualquiera. Máx. 1000.
  repeated string autoscale_allow_players = 4;
}

// Panel → agente. Guarda la spec (sobrevive a reinicios del agente) y reconcilia el contenedor en
// segundo plano. Respuesta: Ack (guardada; el resultado llega por RouterObserved) o Error
// (invalid_request: spec ausente o fuera de rango).
message RouterApply {
  RouterSpec spec = 1;
}

// Panel → agente. Borra la spec guardada y, en segundo plano, el contenedor del router. Idempotente.
// Respuesta: Ack, o Error (io_error) si no se pudo borrar del store del agente.
message RouterRemove {}

// Agente → panel, no solicitado (id = 0): estado del router tras cada reconciliación (al recibir
// RouterApply/RouterRemove, cada 30 s y con los eventos de Docker de su contenedor).
message RouterObserved {
  bool configured = 1; // el agente tiene una spec de router guardada
  string state = 2; // missing|created|running|restarting|exited|dead|paused
  string container_id = 3;
  string image = 4; // imagen del contenedor, p. ej. itzg/mc-router:1.47.1
  uint32 host_port = 5; // puerto de la spec aplicada (0 sin spec)
  bool autoscale = 6;
  string error = 7; // error de la última reconciliación ("" si fue bien)
  int64 ts_unix_ms = 8;
  RouterSpec spec = 9; // spec guardada en el agente (ausente sin spec): la web compara con la del panel
}
// ── plan-9 ──
